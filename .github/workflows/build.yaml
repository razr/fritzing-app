name: Build Fritzing for Windows

on:
  workflow_dispatch: # Allows you to manually click a button to start the build

jobs:
  build-windows:
    runs-on: windows-latest # Tells GitHub to use a fresh Windows machine

    steps:
    - name: Checkout Fritzing App
      uses: actions/checkout@v4
      with:
        path: fritzing-app

    - name: Checkout Fritzing Parts Library
      uses: actions/checkout@v4
      with:
        repository: fritzing/fritzing-parts
        path: fritzing-parts

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Provides a stable environment for aqtinstall

    - name: Remove WindowsApps from PATH
      shell: powershell
      run: |
        $oldPath = [Environment]::GetEnvironmentVariable("PATH", "Machine")
        $newPath = ($oldPath -split ';' | Where-Object { $_ -notlike "*WindowsApps*" }) -join ';'
        [Environment]::SetEnvironmentVariable("PATH", $newPath, "Machine")
        
        # Также очищаем пути для текущей сессии процесса GitHub Actions
        $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike "*WindowsApps*" }) -join ';'
        echo "PATH=$env:PATH" >> $env:GITHUB_ENV

    - name: Install Qt Framework
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2' # The stable Qt version Fritzing needs
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Download Boost Libraries
      run: |
        Invoke-WebRequest -Uri "https://jfrog.io" -OutFile "boost.zip"
        Expand-Archive -Path "boost.zip" -DestinationPath "."
        Rename-Item -Path "boost_1_78_0" -NewName "boost"

    - name: Clone and Build Libgit2
      run: |
        git clone --branch v0.28.5 https://github.com
        cd libgit2
        mkdir build64
        cd build64
        cmake .. -G "Visual Studio 17 2022" -A x64 -DBUILD_SHARED_LIBS=ON -DBUILD_CLAR=OFF
        cmake --build . --config Release

    - name: Compile Fritzing App
      shell: cmd
      run: |
        cd fritzing-app
        qmake phoenix.pro "CONFIG+=release" "INCLUDEPATH+=../boost" "INCLUDEPATH+=../libgit2/include" "LIBS+=-L../libgit2/build64/Release -lgit2"
        nmake

    - name: Upload Finished Executable
      uses: actions/upload-artifact@v4
      with:
        name: Fritzing-Windows-Build
        path: fritzing-app/release/fritzing.exe # Collects your new free application
